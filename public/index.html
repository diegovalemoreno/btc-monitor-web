<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Signal Engine · Dashboard</title>
  <style>
    /* ─── Design tokens ─────────────────────────── */
    :root {
      --bg:         #08080d;
      --surface:    #0f0f18;
      --surface2:   #151520;
      --surface3:   #1c1c2a;
      --border:     #252535;
      --border-dim: #191926;

      --text:       #dde1f0;
      --text-sec:   #7a82a0;
      --text-muted: #404460;

      --orange:     #f7931a;
      --green:      #00cc78;
      --red:        #ef4444;
      --yellow:     #e8a020;

      --regime-CAPITULATION_ZONE:       #00cc78;
      --regime-TACTICAL_BUY_AGGRESSIVE: #00cc78;
      --regime-TACTICAL_BUY_MODERATE:   #44cc88;
      --regime-TACTICAL_BUY_LIGHT:      #88bb66;
      --regime-NEUTRAL:                 #404460;
      --regime-RISK_OFF:                #e8a020;
      --regime-EXTREME_RISK:            #ef4444;
      --regime-OVERLEVERAGED_MARKET:    #ef4444;
      --regime-EUPHORIA_ZONE:           #ef4444;

      --font-sans: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;

      --radius:    10px;
      --radius-sm: 6px;
      --shadow:    0 1px 3px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── Header ────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,8,13,0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      gap: 16px;
    }

    .logo-group { display: flex; flex-direction: column; line-height: 1.3; }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--orange);
      border-radius: 6px;
      color: #000;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      padding-left: 34px;
    }

    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .timestamp {
      font-size: 11px;
      color: var(--text-sec);
      font-family: var(--font-mono);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    #refresh {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    #refresh:hover { border-color: var(--orange); background: var(--surface3); }
    #refresh:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ─── Layout ────────────────────────────────── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 24px 56px;
    }

    /* ─── Section dividers ──────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 24px 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-dim);
    }

    /* ─── Cards ─────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ─── Hero grid ─────────────────────────────── */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .hero-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .hero-value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.5px;
      font-family: var(--font-mono);
    }

    .hero-sub {
      font-size: 11px;
      color: var(--text-sec);
      margin-top: 8px;
      font-family: var(--font-mono);
    }

    /* ─── Regime / score / risk color classes ────── */
    .regime-CAPITULATION_ZONE    { color: var(--green); }
    .regime-TACTICAL_BUY_AGGRESSIVE { color: var(--green); }
    .regime-TACTICAL_BUY_MODERATE   { color: #44cc88; }
    .regime-TACTICAL_BUY_LIGHT      { color: #88bb66; }
    .regime-NEUTRAL                 { color: var(--text-sec); }
    .regime-RISK_OFF                { color: var(--yellow); }
    .regime-EXTREME_RISK            { color: var(--red); }
    .regime-OVERLEVERAGED_MARKET    { color: var(--red); }
    .regime-EUPHORIA_ZONE           { color: var(--red); }

    .score-pos { color: var(--green); }
    .score-neg { color: var(--red); }
    .score-zero { color: var(--text-sec); }

    .risk-LOW    { color: var(--green);  font-weight: 600; }
    .risk-MEDIUM { color: #88bb66;       font-weight: 600; }
    .risk-HIGH   { color: var(--yellow); font-weight: 600; }
    .risk-EXTREME { color: var(--red);   font-weight: 600; }

    /* ─── Indicators table ──────────────────────── */
    table { width: 100%; border-collapse: collapse; }

    thead th {
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 0 10px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border-dim);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }

    tbody td { padding: 10px 0; vertical-align: middle; }

    .ind-name {
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ind-score { width: 64px; text-align: center; }

    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .score-pos .score-badge { background: rgba(0,204,120,0.12); color: var(--green); }
    .score-neg .score-badge { background: rgba(239,68,68,0.12);  color: var(--red); }
    .score-zero .score-badge { background: var(--surface2); color: var(--text-sec); }

    .ind-summary { font-size: 12px; color: var(--text-sec); padding-left: 20px; }

    /* ─── Triggered rules ───────────────────────── */
    .rules-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .rule-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
    }

    .rule-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--orange);
      margin-bottom: 6px;
    }

    .rule-reasons { list-style: none; }
    .rule-reasons li {
      font-size: 12px;
      color: var(--text-sec);
      padding: 1px 0 1px 14px;
      position: relative;
    }
    .rule-reasons li::before {
      content: "›";
      position: absolute;
      left: 2px;
      color: var(--text-muted);
    }

    .no-rules { color: var(--text-sec); font-size: 13px; }

    /* ─── Playbook ──────────────────────────────── */
    .playbook-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .playbook-panel {
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border: 1px solid;
    }
    .playbook-panel.allowed {
      background: rgba(0,204,120,0.04);
      border-color: rgba(0,204,120,0.16);
    }
    .playbook-panel.avoid {
      background: rgba(239,68,68,0.04);
      border-color: rgba(239,68,68,0.14);
    }

    .playbook-col-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .playbook-col-title.allowed { color: var(--green); }
    .playbook-col-title.avoid   { color: var(--red); }

    .playbook-items { list-style: none; }
    .playbook-items li {
      font-size: 12px;
      color: var(--text-sec);
      padding: 5px 0;
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }
    .playbook-items li:last-child { border-bottom: none; }
    .playbook-items.allowed li::before {
      content: "✓";
      color: var(--green);
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .playbook-items.avoid li::before {
      content: "✕";
      color: var(--red);
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ─── Leitura Final ─────────────────────────── */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--orange);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .summary-text {
      font-size: 13px;
      line-height: 1.9;
      color: var(--text-sec);
      white-space: pre-wrap;
      border-left: 2px solid var(--border);
      padding-left: 16px;
      margin-top: 12px;
    }

    /* ─── Loading / error ───────────────────────── */
    #loading, #error-msg {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-sec);
      font-size: 13px;
    }
    #error-msg { color: var(--red); display: none; }
    #dashboard { display: none; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Tooltip ───────────────────────────────── */
    .has-tooltip { cursor: help; }

    .tip-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--surface3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 9px;
      font-style: normal;
      flex-shrink: 0;
    }

    .tooltip-box {
      display: none;
      position: absolute;
      z-index: 9999;
      max-width: 340px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-sec);
      white-space: pre-wrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      pointer-events: none;
      font-family: var(--font-sans);
    }

    /* ─── Responsive ────────────────────────────── */
    @media (max-width: 600px) {
      .hero-grid { grid-template-columns: 1fr; }
      .playbook-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .container { padding: 20px 16px 40px; }
      .header-inner { padding: 0 16px; }
      .card, .summary-card { padding: 16px; }
      .hero-value { font-size: 20px; }
      .timestamp { display: none; }
      .section-label { margin-top: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-group">
      <div class="logo">
        <span class="logo-icon">₿</span>
        Signal Engine
      </div>
      <div class="logo-sub">Monitor de Regime · Tempo Real</div>
    </div>
    <div class="header-right">
      <span class="timestamp" id="ts">—</span>
      <button id="refresh">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
          <path d="M10.5 6a4.5 4.5 0 1 1-1.02-2.86" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M10.5 1.5v2.25H8.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Atualizar
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div id="loading"><span class="spinner"></span>Carregando dados...</div>
  <div id="error-msg"></div>

  <div id="dashboard">

    <div class="hero-grid">
      <div class="hero-card" id="hero-regime">
        <div class="hero-label">Regime de Mercado</div>
        <div class="hero-value" id="h-regime">—</div>
        <div class="hero-sub" id="h-bias">—</div>
      </div>
      <div class="hero-card" id="hero-score">
        <div class="hero-label">Score Ponderado</div>
        <div class="hero-value" id="h-score">—</div>
        <div class="hero-sub" id="h-risk">—</div>
      </div>
      <div class="hero-card" style="border-left-color:var(--orange)">
        <div class="hero-label">Preço BTC</div>
        <div class="hero-value" id="h-price" style="color:var(--orange)">—</div>
        <div class="hero-sub" id="h-raw">—</div>
      </div>
    </div>

    <div class="section-label">Indicadores</div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Indicador</th>
            <th style="text-align:center;width:64px">Pts</th>
            <th style="padding-left:20px">Estado</th>
          </tr>
        </thead>
        <tbody id="indicators-body"></tbody>
      </table>
    </div>

    <div class="section-label">Regras Disparadas</div>
    <div class="card">
      <ul class="rules-list" id="rules-list"></ul>
    </div>

    <div class="section-label">Playbook Tático</div>
    <div class="card">
      <div class="playbook-grid">
        <div class="playbook-panel allowed">
          <div class="playbook-col-title allowed">Permitido</div>
          <ul class="playbook-items allowed" id="playbook-allowed"></ul>
        </div>
        <div class="playbook-panel avoid">
          <div class="playbook-col-title avoid">Evitar</div>
          <ul class="playbook-items avoid" id="playbook-avoid"></ul>
        </div>
      </div>
    </div>

    <div class="section-label">Leitura Final</div>
    <div class="summary-card">
      <div class="card-title">Análise Executiva</div>
      <div class="summary-text" id="summary-text"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
