<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Signal Engine · Dashboard</title>
  <style>
    /* ─── Design tokens (letabuild palette) ────── */
    :root {
      --bg:         #0a0a0a;
      --surface:    #111111;
      --surface2:   #161616;
      --surface3:   #1e1e1e;
      --border:     rgba(224,138,58,0.13);
      --border-dim: rgba(224,138,58,0.07);
      --border-solid: #1e1e1e;

      --text:       #e8e0d5;
      --text-sec:   #b0a090;
      --text-muted: #5a5040;

      --orange:     #e08a3a;
      --orange-dim: rgba(224,138,58,0.15);

      /* signal colors — letabuild exact */
      --buy-strong: #00C853;
      --buy:        #69F0AE;
      --neutral:    #FFD600;
      --sell:       #FF6D00;
      --sell-strong:#FF1744;

      /* regime → signal mapping */
      --regime-CAPITULATION_ZONE:       #00C853;
      --regime-TACTICAL_BUY_AGGRESSIVE: #00C853;
      --regime-TACTICAL_BUY_MODERATE:   #69F0AE;
      --regime-TACTICAL_BUY_LIGHT:      #a8e6c8;
      --regime-NEUTRAL:                 #FFD600;
      --regime-RISK_OFF:                #FF6D00;
      --regime-EXTREME_RISK:            #FF1744;
      --regime-OVERLEVERAGED_MARKET:    #FF1744;
      --regime-EUPHORIA_ZONE:           #FF1744;

      --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;

      --radius:    10px;
      --radius-sm: 8px;
      --shadow:    0 1px 4px rgba(0,0,0,0.6), 0 6px 20px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ─── Header ────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      gap: 16px;
    }

    .logo-group { display: flex; flex-direction: column; line-height: 1.3; }

    .logo {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.1px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      background: var(--orange);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.4px;
      padding-left: 34px;
    }

    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .timestamp {
      font-size: 11px;
      color: var(--text-sec);
      font-family: var(--font-mono);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    #refresh {
      background: transparent;
      border: 1px solid var(--orange-dim);
      color: var(--text-sec);
      padding: 5px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    #refresh:hover { border-color: var(--orange); color: var(--orange); background: rgba(224,138,58,0.06); }
    #refresh:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── Layout ────────────────────────────────── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ─── Section labels ─────────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 28px 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-dim);
    }

    /* ─── Cards ──────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ─── Hero grid ─────────────────────────────── */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-solid);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .hero-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hero-value {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.4px;
      font-family: var(--font-mono);
    }

    .hero-sub {
      font-size: 11px;
      color: var(--text-sec);
      margin-top: 8px;
      font-family: var(--font-mono);
    }

    /* ─── Regime / score / risk colors ──────────── */
    .regime-CAPITULATION_ZONE    { color: var(--buy-strong); }
    .regime-TACTICAL_BUY_AGGRESSIVE { color: var(--buy-strong); }
    .regime-TACTICAL_BUY_MODERATE   { color: var(--buy); }
    .regime-TACTICAL_BUY_LIGHT      { color: #a8e6c8; }
    .regime-NEUTRAL                 { color: var(--neutral); }
    .regime-RISK_OFF                { color: var(--sell); }
    .regime-EXTREME_RISK            { color: var(--sell-strong); }
    .regime-OVERLEVERAGED_MARKET    { color: var(--sell-strong); }
    .regime-EUPHORIA_ZONE           { color: var(--sell-strong); }

    .score-pos  { color: var(--buy-strong); }
    .score-neg  { color: var(--sell-strong); }
    .score-zero { color: var(--neutral); }

    .risk-LOW    { color: var(--buy-strong); font-weight: 600; }
    .risk-MEDIUM { color: var(--buy);        font-weight: 600; }
    .risk-HIGH   { color: var(--sell);       font-weight: 600; }
    .risk-EXTREME { color: var(--sell-strong); font-weight: 600; }

    /* ─── Indicator cards grid ──────────────────── */
    .ind-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .ind-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 2px solid transparent;
      border-radius: 8px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background 0.12s;
      cursor: help;
    }
    .ind-card:hover { background: var(--surface3); }

    .ind-card.sig-pos  { border-left-color: rgba(0,200,83,0.5); }
    .ind-card.sig-neg  { border-left-color: rgba(255,23,68,0.5); }
    .ind-card.sig-zero { border-left-color: rgba(255,214,0,0.35); }

    .ind-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .ind-card-name {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .ind-card-summary {
      font-size: 12px;
      color: var(--text-sec);
      line-height: 1.4;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      padding: 2px 6px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    .score-pos .score-badge  { background: rgba(0,200,83,0.12);  color: var(--buy-strong); }
    .score-neg .score-badge  { background: rgba(255,23,68,0.12);  color: var(--sell-strong); }
    .score-zero .score-badge { background: rgba(255,214,0,0.10);  color: var(--neutral); }

    /* ─── Triggered rules ───────────────────────── */
    .rules-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .rule-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--orange);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
    }

    .rule-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--orange);
      margin-bottom: 6px;
    }

    .rule-reasons { list-style: none; }
    .rule-reasons li {
      font-size: 12px;
      color: var(--text-sec);
      padding: 1px 0 1px 14px;
      position: relative;
    }
    .rule-reasons li::before {
      content: "›";
      position: absolute;
      left: 2px;
      color: var(--text-muted);
    }

    .no-rules { color: var(--text-sec); font-size: 13px; }

    /* ─── Playbook ───────────────────────────────── */
    .playbook-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .playbook-panel {
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border: 1px solid;
    }
    .playbook-panel.allowed {
      background: rgba(0,200,83,0.04);
      border-color: rgba(0,200,83,0.16);
    }
    .playbook-panel.avoid {
      background: rgba(255,23,68,0.04);
      border-color: rgba(255,23,68,0.14);
    }

    .playbook-col-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .playbook-col-title.allowed { color: var(--buy-strong); }
    .playbook-col-title.avoid   { color: var(--sell-strong); }

    .playbook-items { list-style: none; }
    .playbook-items li {
      font-size: 12px;
      color: var(--text-sec);
      padding: 5px 0;
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }
    .playbook-items li:last-child { border-bottom: none; }
    .playbook-items.allowed li::before {
      content: "✓";
      color: var(--buy-strong);
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .playbook-items.avoid li::before {
      content: "✕";
      color: var(--sell-strong);
      font-weight: 700;
      font-size: 11px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ─── Leitura Final ──────────────────────────── */
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--orange);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .summary-text {
      font-size: 13px;
      line-height: 1.9;
      color: var(--text-sec);
      white-space: pre-wrap;
      border-left: 2px solid var(--border-solid);
      padding-left: 16px;
      margin-top: 12px;
    }

    /* ─── Loading / error ────────────────────────── */
    #loading, #error-msg {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-sec);
      font-size: 13px;
    }
    #error-msg { color: var(--sell-strong); display: none; }
    #dashboard { display: none; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border-solid);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Tooltip ────────────────────────────────── */
    .has-tooltip { cursor: help; }

    .tip-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--surface3);
      border: 1px solid var(--border-solid);
      color: var(--text-muted);
      font-size: 9px;
      font-style: normal;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
      cursor: help;
    }
    .tip-icon:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    .tooltip-box {
      display: none;
      position: absolute;
      z-index: 9999;
      max-width: 320px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-sec);
      white-space: pre-wrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      pointer-events: none;
      font-family: var(--font-sans);
    }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 780px) {
      .ind-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .hero-grid      { grid-template-columns: 1fr; }
      .playbook-grid  { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .ind-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .container      { padding: 20px 16px 40px; }
      .header-inner   { padding: 0 16px; }
      .card, .summary-card { padding: 16px; }
      .hero-value     { font-size: 19px; }
      .timestamp      { display: none; }
      .section-label  { margin-top: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-group">
      <div class="logo">
        <span class="logo-icon">₿</span>
        Signal Engine
      </div>
      <div class="logo-sub">Monitor de Regime · Tempo Real</div>
    </div>
    <div class="header-right">
      <span class="timestamp" id="ts">—</span>
      <button id="refresh">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
          <path d="M10.5 6a4.5 4.5 0 1 1-1.02-2.86" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M10.5 1.5v2.25H8.25" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Atualizar
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div id="loading"><span class="spinner"></span>Carregando dados...</div>
  <div id="error-msg"></div>

  <div id="dashboard">

    <div class="hero-grid">
      <div class="hero-card" id="hero-regime">
        <div class="hero-label">
          Regime de Mercado
          <span class="tip-icon has-tooltip" data-tooltip="Classificação geral do mercado derivada de todos os indicadores.

CAPITULATION ZONE — capitulação histórica, rara e excelente para acumular.
TACTICAL BUY — sinal de compra com força variável (AGGRESSIVE, MODERATE, LIGHT).
NEUTRAL — sem sinal claro, manter DCA normal.
RISK OFF — mercado em alerta, reduzir exposição.
EXTREME RISK / EUPHORIA — topo de ciclo provável, não aumentar posição.">?</span>
        </div>
        <div class="hero-value" id="h-regime">—</div>
        <div class="hero-sub" id="h-bias">—</div>
      </div>

      <div class="hero-card" id="hero-score">
        <div class="hero-label">
          Score Ponderado
          <span class="tip-icon has-tooltip" data-tooltip="Média ponderada dos scores de todos os indicadores ativos.

Positivo → confluência de sinais de compra.
Negativo → confluência de sinais de venda ou alerta.
Próximo de zero → mercado sem direção clara.

O Risco (LOW / MEDIUM / HIGH / EXTREME) é derivado deste score em conjunto com o Regime.">?</span>
        </div>
        <div class="hero-value" id="h-score">—</div>
        <div class="hero-sub" id="h-risk">—</div>
      </div>

      <div class="hero-card" style="border-left-color:var(--orange)">
        <div class="hero-label">
          Preço BTC
          <span class="tip-icon has-tooltip" data-tooltip="Preço atual do Bitcoin em dólares americanos, obtido da Binance em tempo real.

Usado como referência para cálculos de Mayer Multiple e posição relativa às médias móveis.

Score bruto = soma direta dos pontos. Score ponderado = ajustado pelo peso de cada indicador no regime atual.">?</span>
        </div>
        <div class="hero-value" id="h-price" style="color:var(--orange)">—</div>
        <div class="hero-sub" id="h-raw">—</div>
      </div>
    </div>

    <div class="section-label">Indicadores</div>
    <div class="ind-grid" id="indicators-body"></div>

    <div class="section-label">Regras Disparadas</div>
    <div class="card">
      <ul class="rules-list" id="rules-list"></ul>
    </div>

    <div class="section-label">Playbook Tático</div>
    <div class="card">
      <div class="playbook-grid">
        <div class="playbook-panel allowed">
          <div class="playbook-col-title allowed">Permitido</div>
          <ul class="playbook-items allowed" id="playbook-allowed"></ul>
        </div>
        <div class="playbook-panel avoid">
          <div class="playbook-col-title avoid">Evitar</div>
          <ul class="playbook-items avoid" id="playbook-avoid"></ul>
        </div>
      </div>
    </div>

    <div class="section-label">Leitura Final</div>
    <div class="summary-card">
      <div class="card-title">Análise Executiva</div>
      <div class="summary-text" id="summary-text"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
